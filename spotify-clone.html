<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musify - Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @property --accent{syntax:"<color>";inherits:true;initial-value:#2b2b4a}
  :root{--bg:#000;--panel:#121212;--card:#181818;--hover:#282828;--text:#fff;--sub:#b3b3b3;--green:#1db954}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr 90px;gap:8px;padding:8px}
  button{background:none;border:0;color:inherit;cursor:pointer;font:inherit}
  button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  /* Sidebar */
  .side{grid-row:1;display:flex;flex-direction:column;gap:8px}
  .box{background:var(--panel);border-radius:10px;padding:18px}
  .nav a{display:flex;gap:16px;align-items:center;padding:8px 4px;color:var(--sub);font-weight:700;text-decoration:none;cursor:pointer}
  .nav a:hover,.nav a.on{color:#fff}
  .logo{font-size:22px;font-weight:800;margin-bottom:14px;color:#fff}
  .logo span{color:var(--green)}
  .lib{flex:1;overflow:auto}
  .lib h4{color:var(--sub);margin-bottom:14px}
  .pl{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
  .pl:hover{background:var(--hover)}
  .pl i{width:44px;height:44px;border-radius:4px;flex:none}
  .pl small{display:block;color:var(--sub)}
  /* Main */
  main{background:linear-gradient(#2b2b4a 0,var(--panel) 300px);border-radius:10px;overflow:auto;padding:0 28px 28px;grid-row:1}
  .top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 0;background:transparent;z-index:2}
  .search{background:#242424;border-radius:30px;padding:10px 18px;width:min(360px,60%);display:flex;gap:8px;align-items:center}
  .search input{background:none;border:0;color:#fff;width:100%;font-size:14px;outline:none}
  .user{background:#000;border-radius:30px;padding:6px 14px 6px 6px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
  .user b{width:28px;height:28px;border-radius:50%;background:var(--green);color:#000;display:grid;place-items:center}
  h2{font-size:26px;margin:22px 0 14px}
  .chips{display:flex;gap:8px;margin-bottom:6px}
  .chip{background:#ffffff1a;border-radius:20px;padding:7px 16px;font-size:14px}
  .chip.on{background:#fff;color:#000}
  .quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .q{display:flex;align-items:center;background:#ffffff1a;border-radius:6px;overflow:hidden;cursor:pointer;font-weight:700;position:relative}
  .q:hover{background:#ffffff33}
  .q i{width:64px;height:64px;margin-right:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
  .card{background:var(--card);padding:14px;border-radius:8px;cursor:pointer;position:relative;transition:background .2s}
  .card:hover{background:var(--hover)}
  .card i{display:block;aspect-ratio:1;border-radius:6px;margin-bottom:12px;box-shadow:0 8px 20px #0007}
  .card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card small{color:var(--sub);font-size:13px;display:block;margin-top:4px}
  .play{position:absolute;right:22px;bottom:84px;width:44px;height:44px;border-radius:50%;background:var(--green);color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 8px 16px #0006;font-size:16px}
  .card:hover .play{opacity:1;transform:none}
  /* Song list */
  .songs{width:100%;border-collapse:collapse;margin-top:6px}
  .songs th{color:var(--sub);font-weight:400;text-align:left;padding:8px 12px;border-bottom:1px solid #ffffff1a;font-size:13px}
  .songs td{padding:8px 12px;color:var(--sub);font-size:14px}
  .songs tr.row{cursor:pointer;border-radius:6px}
  .songs tr.row:hover td{background:#ffffff1a}
  .songs td:first-child{border-radius:6px 0 0 6px;width:40px}
  .songs td:last-child{border-radius:0 6px 6px 0;text-align:right}
  .songs tr.cur td{color:var(--green)}
  .songs .t{display:flex;gap:12px;align-items:center;color:#fff}
  .songs tr.cur .t{color:var(--green)}
  .songs .t i{width:40px;height:40px;border-radius:4px}
  /* Player bar */
  footer{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 12px}
  .now{display:flex;gap:12px;align-items:center;min-width:0}
  .now i{width:56px;height:56px;border-radius:4px;flex:none}
  .now b,.now small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now small{color:var(--sub);font-size:12px}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:8px}
  .btns{display:flex;gap:18px;align-items:center}
  .btns button{color:var(--sub);font-size:18px}
  .btns button:hover{color:#fff}
  .btns button.on{color:var(--green)}
  .pp{width:36px;height:36px;border-radius:50%;background:#fff;color:#000!important;display:grid;place-items:center;font-size:14px!important}
  .pp:hover{transform:scale(1.06)}
  .bar{display:flex;gap:8px;align-items:center;width:100%;max-width:560px;color:var(--sub);font-size:12px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--v,0%),#4d4d4d var(--v,0%));flex:1;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
  input[type=range]:hover{--c:1}
  input[type=range]:hover::-webkit-slider-thumb{opacity:1}
  .bar:hover input[type=range]{background:linear-gradient(to right,var(--green) var(--v,0%),#4d4d4d var(--v,0%))}
  .vol{display:flex;gap:8px;align-items:center;justify-content:flex-end;color:var(--sub)}
  .vol input{max-width:110px}
  .hide{display:none}
  /* ===== Premium polish ===== */
  body{font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif;background:#050505;--accent:#2b2b4a;transition:--accent .9s ease;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:10px;border:3px solid transparent;background-clip:content-box}
  .box{background:linear-gradient(180deg,#161616,#101010);border:1px solid #ffffff0d;border-radius:16px;box-shadow:0 10px 30px #0008}
  .logo{font-size:24px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(90deg,#fff,#9affc0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo span{color:var(--green);-webkit-text-fill-color:var(--green)}
  .nav a{border-radius:8px;transition:color .2s,transform .2s}
  .nav a:hover{transform:translateX(3px)}
  .nav a.on{color:#fff}
  .pl{border-radius:10px;transition:background .2s}
  .pl i{border-radius:8px;box-shadow:0 4px 12px #0007}
  main{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 55%,#0e0e0e) 0,#0e0e0e 420px);border:1px solid #ffffff0d;border-radius:16px;box-shadow:0 10px 30px #0008}
  .top{backdrop-filter:blur(14px);margin:0 -28px;padding:16px 28px;background:linear-gradient(#0e0e0e66,transparent)}
  .search{background:#ffffff14;border:1px solid #ffffff14;transition:.2s}
  .search:focus-within{background:#ffffff1f;border-color:#ffffff55;box-shadow:0 0 0 4px #ffffff10}
  .user{background:#0009;border:1px solid #ffffff14}
  .user b{background:linear-gradient(135deg,#1ed760,#0b8a3a)}
  h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
  .chip{border:1px solid #ffffff14;cursor:pointer;transition:.2s;font-weight:600}
  .chip:hover{background:#ffffff33}
  .chip.on{background:#fff;border-color:#fff}
  .q{border:1px solid #ffffff0f;background:#ffffff12;backdrop-filter:blur(8px);border-radius:10px;transition:background .25s,transform .25s}
  .q:hover{background:#ffffff26;transform:translateY(-2px)}
  .q i{border-radius:0;box-shadow:4px 0 16px #0005}
  .card{background:linear-gradient(180deg,#1a1a1a,#141414);border:1px solid #ffffff0a;border-radius:16px;padding:16px;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .3s}
  .card:hover{transform:translateY(-6px);background:linear-gradient(180deg,#242424,#181818);box-shadow:0 18px 40px #000a}
  .card i{border-radius:10px;box-shadow:0 14px 28px #0009}
  .card b{font-weight:700}
  .play{background:linear-gradient(135deg,#2bf26e,#14a34a);box-shadow:0 10px 24px #1db95466;transition:.25s}
  .play:hover{transform:scale(1.08)!important}
  .songs th{text-transform:none;letter-spacing:0;font-weight:500}
  .songs td{transition:background .15s}
  .songs .t i{border-radius:6px;box-shadow:0 4px 10px #0007}
  .songs .t{font-weight:600}
  .eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
  .eq b{width:3px;background:var(--green);border-radius:2px;height:4px}
  .eq.on b{animation:eq 0.9s ease-in-out infinite}
  .eq.on b:nth-child(2){animation-delay:.2s}.eq.on b:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  footer{background:#0c0c0ccc;backdrop-filter:blur(24px);border:1px solid #ffffff14;border-radius:16px;box-shadow:0 -6px 40px #000c, 0 0 80px -30px var(--accent)}
  .now i{border-radius:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 60%,#000)}
  .pp{background:linear-gradient(135deg,#fff,#d8d8d8);box-shadow:0 6px 18px #ffffff30;transition:transform .15s}
  .btns button{transition:color .2s,transform .15s}
  .btns button:active{transform:scale(.9)}
  input[type=range]{height:5px}
  input[type=range]::-webkit-slider-thumb{box-shadow:0 0 8px #0009}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .mnav{display:none}
  @media(max-width:760px){
    body{grid-template-columns:1fr;grid-template-rows:1fr auto auto;gap:6px;padding:6px 6px 0}
    .side,.vol,.user span{display:none}
    main{padding:0 14px 20px}
    .top{padding:12px 0}
    .search{width:100%;margin-right:10px}
    h2{font-size:21px;margin:18px 0 12px}
    .quick{grid-template-columns:1fr 1fr;gap:8px}
    .q{font-size:13px}.q i{width:52px;height:52px;margin-right:10px}
    .grid{grid-template-columns:1fr 1fr;gap:12px}
    .card{padding:10px}
    .play{opacity:1;transform:none;width:38px;height:38px;bottom:70px;right:16px}
    .songs th:nth-child(3),.songs td:nth-child(3){display:none}
    .songs td,.songs th{padding:8px 6px}
    footer{grid-template-columns:1fr;gap:6px;padding:8px 10px;height:auto}
    .now i{width:44px;height:44px}
    .btns{gap:26px}
    .top{margin:0 -14px;padding:12px 14px}.mnav{display:flex;grid-column:1/-1;justify-content:space-around;padding:8px 0 10px;background:#000c;backdrop-filter:blur(20px);border-top:1px solid #ffffff10}
    .mnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:11px;font-weight:700;cursor:pointer;padding:2px 22px}
    .mnav a span{font-size:20px}
    .mnav a.on{color:#fff}
  }
</style>
</head>
<body>

<aside class="side">
  <div class="box nav">
    <div class="logo">Music<span>ify</span></div>
    <a class="on" data-view="home">&#8962; Home</a>
    <a data-view="search">&#9906; Search</a>
  </div>
  <div class="box lib">
    <h4>Your Library</h4>
    <div id="libList"></div>
  </div>
</aside>

<main id="main">
  <div class="top">
    <div class="search"><span>&#9906;</span><input id="q" placeholder="What do you want to play?" aria-label="Search songs"></div>
    <div class="user"><b>U</b>Profile</div>
  </div>
  <div id="view"></div>
</main>

<footer>
  <div class="now">
    <i id="npCover"></i>
    <div><b id="npTitle">Pick a song</b><small id="npArtist">Nothing playing</small></div>
  </div>
  <div class="ctrl">
    <div class="btns">
      <button id="shuf" title="Shuffle">&#8644;</button>
      <button id="prev" title="Previous">&#9198;</button>
      <button id="pp" class="pp" title="Play">&#9654;</button>
      <button id="next" title="Next">&#9197;</button>
      <button id="rep" title="Repeat">&#8635;</button>
    </div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0"><span id="dur">0:00</span></div>
  </div>
  <div class="vol"><span>&#128266;</span><input type="range" id="vol" min="0" max="100" value="70"></div>
</footer>

<nav class="mnav">
  <a class="on" data-view="home"><span>&#8962;</span>Home</a>
  <a data-view="search"><span>&#9906;</span>Search</a>
  <a data-view="lib"><span>&#9835;</span>Library</a>
</nav>

<script>
/* ---------- Data (original placeholder songs; covers are CSS gradients) ---------- */
const g=(a,b)=>`linear-gradient(135deg,${a},${b})`;
const songs=[
  {t:"Raathu Raasan",a:"Karuppu",al:"Karuppu",d:195,src:"songs/raathu-raasan.mp3",c:"url(songs/covers/raathu-raasan.jpg) center/cover",ac:"#918171"},
  {t:"Benz In The Universe",a:"Benz",al:"Benz",d:120,src:"songs/benz-in-the-universe.mp3",c:"url(songs/covers/benz-in-the-universe.jpg) center/cover",ac:"#782b1c"},
  {t:"Last 7 Minutes",a:"Dude (BGM)",al:"Dude Side A BGM",d:44,src:"songs/last-7-minutes.mp3",c:"url(songs/covers/last-7-minutes.jpg) center/cover",ac:"#b89bc8"},
  {t:"Verappa",a:"Karuppu",al:"Karuppu",d:100,src:"songs/verappa.mp3",c:"url(songs/covers/verappa.jpg) center/cover",ac:"#9e4334"},
  {t:"Katchi Sera",a:"Sai Abhyankkar",al:"Katchi Sera (Indie)",d:182,src:"songs/katchi-sera.mp3",c:"url(songs/covers/katchi-sera.jpg) center/cover",ac:"#c84e26"},
  {t:"Karuppa Kooda Va",a:"Sai Abhyankkar",al:"Karuppu",d:250,src:"songs/karuppa-kooda-va.mp3",c:"url(songs/covers/karuppa-kooda-va.jpg) center/cover",ac:"#c85a44"},
  {t:"Alapuzha Sandhayila",a:"G. V. Prakash Kumar",al:"Youth",d:123,src:"songs/alapuzha-sandhayila.mp3",c:"url(songs/covers/alapuzha-sandhayila.jpg) center/cover",ac:"#c8b2a7"},
  {t:"Bloody Band",a:"Anirudh Ravichander",al:"DC",d:156,src:"songs/bloody-band.mp3",c:"url(songs/covers/bloody-band.jpg) center/cover",ac:"#c8c1c0"},
  {t:"Sol",a:"A.R. Rahman, Rakshita Suresh",al:"Ponniyin Selvan Part-1",d:134,src:"songs/sol.mp3",c:"url(songs/covers/sol.jpg) center/cover",ac:"#c8996c"},
  {t:"Ain't Nobody",a:"Anirudh Ravichander",al:"DC",d:163,src:"songs/aint-nobody.mp3",c:"url(songs/covers/aint-nobody.jpg) center/cover",ac:"#c8c1c0"}
];
const lists=[
  {n:"Karuppu Hits",s:"Playlist",c:songs[0].c},
  {n:"Sai Abhyankkar",s:"Playlist",c:songs[4].c},
  {n:"Anirudh Mix",s:"Playlist",c:songs[7].c},
  {n:"Benz Universe",s:"Playlist",c:songs[1].c},
  {n:"Ponniyin Selvan",s:"Playlist",c:songs[8].c},
  {n:"Youth Vibes",s:"Playlist",c:songs[6].c}
];
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

/* ---------- State ---------- */
let idx=-1,playing=false,pos=0,shuffle=false,repeat=false,timer=null,filter="";
const $=id=>document.getElementById(id);

/* ---------- Render ---------- */
function songTable(list){
  return `<table class="songs"><tr><th>#</th><th>Title</th><th>Album</th><th style="text-align:right">Time</th></tr>`+
  list.map(s=>{const i=songs.indexOf(s);return `<tr class="row ${i===idx?'cur':''}" data-i="${i}"><td>${i===idx?`<span class="eq ${playing?'on':''}"><b></b><b></b><b></b></span>`:i+1}</td><td><div class="t"><i style="background:${s.c}"></i><div>${s.t}<div style="color:var(--sub);font-size:13px">${s.a}</div></div></div></td><td>${s.al}</td><td>${fmt(s.d)}</td></tr>`}).join("")+`</table>`;
}
function home(){
  $("view").innerHTML=`
  <div class="chips"><span class="chip on">All</span><span class="chip">Music</span><span class="chip">Podcasts</span></div>
  <h2>Good evening</h2>
  <div class="quick">${lists.map((l,i)=>`<div class="q" data-p="${i}"><i style="background:${l.c}"></i>${l.n}</div>`).join("")}</div>
  <h2>Made for you</h2>
  <div class="grid">${lists.map((l,i)=>`<div class="card" data-p="${i}"><i style="background:${l.c}"></i><b>${l.n}</b><small>Fresh picks based on what you play</small><button class="play" aria-label="Play ${l.n}">&#9654;</button></div>`).join("")}</div>
  <h2>Popular songs</h2>${songTable(songs)}`;
}
function search(){
  const r=songs.filter(s=>(s.t+s.a+s.al).toLowerCase().includes(filter.toLowerCase()));
  $("view").innerHTML=`<h2>${filter?'Results for "'+filter.replace(/</g,"&lt;")+'"':'Browse all songs'}</h2>`+(r.length?songTable(r):`<p style="color:var(--sub)">No songs found. Try a different title or artist.</p>`);
}
let view="home";
function lib(){
  $("view").innerHTML=`<h2>Your Library</h2><div class="grid">${lists.map((l,i)=>`<div class="card" data-p="${i}"><i style="background:${l.c}"></i><b>${l.n}</b><small>Playlist</small></div>`).join("")}</div>`;
}
function render(){view==="home"?home():view==="lib"?lib():search()}
$("libList").innerHTML=lists.map((l,i)=>`<div class="pl" data-p="${i}"><i style="background:${l.c}"></i><div><b>${l.n}</b><small>${l.s}</small></div></div>`).join("");

/* ---------- Player (real audio from the songs/ folder) ---------- */
const audio=new Audio();audio.preload="metadata";audio.volume=.7;
function load(i){
  idx=i;pos=0;const s=songs[i];
  $("npTitle").textContent=s.t;$("npArtist").textContent=s.a;$("npCover").style.background=s.c;
  document.body.style.setProperty("--accent",s.ac);
  $("dur").textContent=fmt(s.d);$("seek").max=s.d;
  audio.src=s.src;play();
}
function play(){
  if(idx<0){load(0);return}
  audio.play().then(()=>{playing=true;$("pp").innerHTML="&#10074;&#10074;";$("pp").title="Pause";render()})
    .catch(()=>{playing=false;$("npArtist").textContent="Can't play - keep the songs folder next to this file"});
}
function pause(){audio.pause();playing=false;$("pp").innerHTML="&#9654;";$("pp").title="Play";render()}
function tick(){
  const d=audio.duration||songs[idx].d;
  $("cur").textContent=fmt(pos);$("seek").value=pos;
  $("seek").style.setProperty("--v",(pos/d*100)+"%");
}
audio.addEventListener("timeupdate",()=>{pos=audio.currentTime;tick()});
audio.addEventListener("loadedmetadata",()=>{if(isFinite(audio.duration)){$("seek").max=audio.duration;$("dur").textContent=fmt(audio.duration)}});
audio.addEventListener("ended",()=>{repeat?load(idx):nextSong()});
audio.addEventListener("error",()=>{playing=false;$("pp").innerHTML="&#9654;";$("npArtist").textContent="File not found - keep the songs folder next to this file"});
function nextSong(){load(shuffle?Math.floor(Math.random()*songs.length):(idx+1)%songs.length)}
function prevSong(){pos>3?(audio.currentTime=0):load((idx-1+songs.length)%songs.length)}

$("pp").onclick=()=>playing?pause():play();
$("next").onclick=nextSong;$("prev").onclick=prevSong;
$("shuf").onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle("on",shuffle)};
$("rep").onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle("on",repeat)};
$("seek").oninput=e=>{if(idx<0)return;audio.currentTime=+e.target.value;pos=audio.currentTime;tick()};
$("vol").oninput=e=>{e.target.style.setProperty("--v",e.target.value+"%");audio.volume=e.target.value/100};
$("vol").style.setProperty("--v","70%");

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const row=e.target.closest(".row");if(row){load(+row.dataset.i);return}
  const p=e.target.closest("[data-p]");if(p){load(+p.dataset.p%songs.length);return}
  const n=e.target.closest("[data-view]");
  if(n){view=n.dataset.view;document.querySelectorAll(".nav a,.mnav a").forEach(a=>a.classList.toggle("on",a.dataset.view===n.dataset.view));render()}
});
$("q").addEventListener("input",e=>{filter=e.target.value;view="search";document.querySelectorAll(".nav a,.mnav a").forEach(a=>a.classList.toggle("on",a.dataset.view==="search"));search()});
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();$("pp").click()}});

render();
</script>
</body>
</html>
